name: Publish AAR to Maven Central Portal

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: 'Maven Version to publish (e.g. 1.24.3-shaft-xxxx or auto)'
        required: false
        default: 'auto'
      source_run_id:
        description: 'GitHub Actions Run ID to fetch AAR from (leave empty to use latest successful build)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AAR Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          RUN_ID="${{ github.event.inputs.source_run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "Searching for latest successful build-aar run..."
            RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow build-aar.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Error: No successful build-aar run found!"
            exit 1
          fi
          echo "Downloading AAR artifact from run $RUN_ID..."
          mkdir -p /tmp/download_aar
          gh run download "$RUN_ID" --repo "${{ github.repository }}" -n onnxruntime-android-custom -D /tmp/download_aar/
          AAR_FILE=$(find /tmp/download_aar -name "*.aar" 2>/dev/null | head -n 1)
          if [ -z "$AAR_FILE" ] || [ ! -f "$AAR_FILE" ]; then
            echo "Error: AAR file not found in downloaded artifact!"
            exit 1
          fi
          cp "$AAR_FILE" dist/onnxruntime-android-custom.aar
          ls -lh dist/onnxruntime-android-custom.aar
          echo "Downloaded AAR size: $(stat -c%s dist/onnxruntime-android-custom.aar) bytes"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Publish to Maven Central Portal
        env:
          GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
          SONATYPE_CENTRAL_TOKEN: ${{ secrets.SONATYPE_CENTRAL_TOKEN }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import || true
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          VER="${{ github.event.inputs.artifact_version }}"
          if [ -z "$VER" ] || [ "$VER" = "auto" ]; then
            VER="1.24.3-shaft-${SHORT_SHA}"
          fi
          echo "Publishing verified AAR to Maven Central with version: $VER"
          python3 ./publish_central.py \
            --aar dist/onnxruntime-android-custom.aar \
            --group-id io.github.wangwang-code \
            --artifact-id onnxruntime-android-shaft \
            --version "$VER" \
            --gpg-passphrase "$GPG_PASSPHRASE" \
            --central-token "$SONATYPE_CENTRAL_TOKEN" \
            --publishing-type AUTOMATIC

      - name: Upload Central Bundle Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: ./bundle.zip
          if-no-files-found: ignore
