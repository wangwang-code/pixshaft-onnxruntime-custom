name: Build Custom ONNX Runtime Android AAR

on:
  workflow_dispatch:
    inputs:
      ort_version:
        description: 'ONNX Runtime Git tag/branch'
        required: true
        default: 'v1.24.3'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true
      publish_to_central:
        description: 'Publish to Maven Central Portal'
        type: boolean
        default: true
      artifact_version:
        description: 'Version to publish to Maven Central'
        required: true
        default: '1.24.3' 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout ONNX Runtime
        uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: ${{ github.event.inputs.ort_version || 'v1.24.3' }}
          submodules: recursive
          path: onnxruntime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install flatbuffers numpy packaging

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-onnxruntime-ccache
          max-size: 2G

      - name: Locate Android SDK and NDK
        id: android-env
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          else
            NDK_PATH=$(ls -d ${ANDROID_HOME}/ndk/* 2>/dev/null | tail -n 1)
          fi
          echo "Using Android SDK: $ANDROID_HOME"
          echo "Using Android NDK: $NDK_PATH"
          echo "ndk_path=$NDK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify operator configuration
        run: |
          echo "=== Content of required_operators.config ==="
          cat ./required_operators.config

      - name: Build custom AAR package (arm64-v8a)
        run: |
          python3 onnxruntime/tools/ci_build/github/android/build_aar_package.py \
            ./build_settings.json \
            --config Release \
            --include_ops_by_config ./required_operators.config \
            --android_sdk_path "$ANDROID_HOME" \
            --android_ndk_path "${{ steps.android-env.outputs.ndk_path }}" \
            --build_dir ./build

      - name: Inspect generated AAR and measure size
        id: measure
        run: |
          AAR_FILE=$(find ./build/aar_out -name "*.aar" | head -n 1)
          if [ -z "$AAR_FILE" ]; then
            echo "Error: No AAR file found!"
            exit 1
          fi
          echo "Found AAR: $AAR_FILE"
          cp "$AAR_FILE" ./onnxruntime-android-custom.aar

          # Inspect .so sizes inside AAR
          mkdir -p ./aar_extracted
          unzip -q ./onnxruntime-android-custom.aar -d ./aar_extracted

          RAW_SO_SIZE=$(stat -c%s ./aar_extracted/jni/arm64-v8a/libonnxruntime.so)
          RAW_SO_MB=$(python3 -c "print(round($RAW_SO_SIZE / 1024 / 1024, 2))")
          AAR_TOTAL_SIZE=$(stat -c%s ./onnxruntime-android-custom.aar)
          AAR_TOTAL_MB=$(python3 -c "print(round($AAR_TOTAL_SIZE / 1024 / 1024, 2))")

          echo "raw_so_mb=$RAW_SO_MB" >> "$GITHUB_OUTPUT"
          echo "aar_total_mb=$AAR_TOTAL_MB" >> "$GITHUB_OUTPUT"

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 Custom ONNX Runtime AAR Build Summary
          - **AAR Total Size**: \`${AAR_TOTAL_MB} MB\` (${AAR_TOTAL_SIZE} bytes)
          - **libonnxruntime.so (arm64-v8a uncompressed)**: \`${RAW_SO_MB} MB\` (${RAW_SO_SIZE} bytes)
          - **Architectures included**: \`arm64-v8a\` only
          - **Operators Profile**: Merged (Raw ONNX ops + Runtime Fused ops)
          - **Optimizations**: ccache enabled, LTO stripped for faster CI
          EOF

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-android-custom
          path: ./onnxruntime-android-custom.aar

      - name: Create Release
        if: ${{ (github.event.inputs.create_release == 'true') || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v1.24.3-shaft-${{ github.run_number }}"
          fi
          gh release create "$TAG_NAME" ./onnxruntime-android-custom.aar \
            --repo "${{ github.repository }}" \
            --title "ONNX Runtime Custom AAR ($TAG_NAME)" \
            --notes "Custom minimal ONNX Runtime AAR for Pixiv-Shaft (arm64-v8a only, merged operator set covering raw ONNX ops and runtime fused ops like MatMulIntegerToFloat)."

      - name: Deploy to mvn-repo branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/mvn-repo
          cd /tmp/mvn-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin mvn-repo 2>/dev/null || true
          git checkout mvn-repo 2>/dev/null || git checkout --orphan mvn-repo

          SRC_MAVEN_DIR="$GITHUB_WORKSPACE/build/aar_out/Release/com/microsoft/onnxruntime/onnxruntime-android"
          DEST_MAVEN_DIR="com/microsoft/onnxruntime/onnxruntime-android"
          mkdir -p "$DEST_MAVEN_DIR"
          cp -r "$SRC_MAVEN_DIR"/* "$DEST_MAVEN_DIR"/

          if [ -d "$DEST_MAVEN_DIR/1.24.3" ]; then
            rm -rf "$DEST_MAVEN_DIR/1.24.3-custom"
            cp -r "$DEST_MAVEN_DIR/1.24.3" "$DEST_MAVEN_DIR/1.24.3-custom"
            cd "$DEST_MAVEN_DIR/1.24.3-custom"
            for f in *1.24.3*; do
              mv "$f" "${f//1.24.3/1.24.3-custom}"
            done
            if [ -f onnxruntime-android-1.24.3-custom.pom ]; then
              sed -i 's/<version>1.24.3<\/version>/<version>1.24.3-custom<\/version>/g' onnxruntime-android-1.24.3-custom.pom
            fi
            for f in onnxruntime-android-1.24.3-custom.aar onnxruntime-android-1.24.3-custom.pom; do
              if [ -f "$f" ]; then
                md5sum "$f" | awk '{print $1}' > "${f}.md5"
                sha1sum "$f" | awk '{print $1}' > "${f}.sha1"
              fi
            done
            cd /tmp/mvn-repo
          fi

          git add -A
          git commit -m "deploy: update onnxruntime-android maven artifacts (${{ github.sha }})" || echo "No changes to commit"
          git push -u origin mvn-repo --force
      - name: Publish to Maven Central Portal
        if: ${{ github.event.inputs.publish_to_central == 'true' || github.event.inputs.publish_to_central == '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
          SONATYPE_CENTRAL_TOKEN: ${{ secrets.SONATYPE_CENTRAL_TOKEN }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import --pinentry-mode loopback || true
          fi
          python3 ./publish_central.py \
            --aar ./onnxruntime-android-custom.aar \
            --group-id io.github.wangwang-code \
            --artifact-id onnxruntime-android-shaft \
            --version "${{ github.event.inputs.artifact_version || '1.24.3' }}" \
            --gpg-passphrase "$GPG_PASSPHRASE" \
            --central-token "$SONATYPE_CENTRAL_TOKEN" \
            --publishing-type AUTOMATIC

      - name: Upload Central Bundle Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: ./bundle.zip
          if-no-files-found: ignore
